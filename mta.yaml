_schema-version: "2.1"
ID: TRAINING_HANA
version: 0.0.1
modules:
- name: db
  type: hdb
  path: db
  requires:
  - name: hdi_db
    properties:
      TARGET_CONTAINER: ~{service-name}

resources:
- name: hdi_db
  type: com.sap.xs.hdi-container
  parameters:
    config:
      schema:Tables
  properties:
    service-name: ${service-name}

